<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#ffffff"/>
  <text x="60" y="58" font-size="26" font-weight="bold" fill="#0f172a">典型工作流：从搜索到可复用笔记</text>
  <text x="60" y="88" font-size="15" fill="#64748b">Agent 场景下的完整链路（搜索 → 抓取 → 结构化 → 沉淀）</text>

  <!-- 步骤 1 -->
  <rect x="60" y="150" width="200" height="150" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <circle cx="110" cy="200" r="22" fill="#4f46e5"/>
  <text x="110" y="207" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="160" y="205" font-size="15" font-weight="bold" fill="#3730a3">搜索</text>
  <text x="160" y="230" font-size="12" fill="#6366f1">search_web("MCP 教程")</text>
  <text x="160" y="252" font-size="11" fill="#94a3b8">Bing 返回标题/链接/摘要</text>
  <text x="160" y="274" font-size="11" fill="#94a3b8">结果 4~8 条，免 API Key</text>

  <!-- 步骤 2 -->
  <rect x="330" y="150" width="200" height="150" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="380" cy="200" r="22" fill="#059669"/>
  <text x="380" y="207" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="430" y="205" font-size="15" font-weight="bold" fill="#065f46">抓取</text>
  <text x="430" y="230" font-size="12" fill="#047857">fetch_web_md(url)</text>
  <text x="430" y="252" font-size="11" fill="#94a3b8">HTML → Markdown</text>
  <text x="430" y="274" font-size="11" fill="#94a3b8">保留标题/代码块/表格</text>

  <!-- 步骤 3 -->
  <rect x="600" y="150" width="200" height="150" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="650" cy="200" r="22" fill="#ea580c"/>
  <text x="650" y="207" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="700" y="205" font-size="15" font-weight="bold" fill="#9a3412">结构化</text>
  <text x="700" y="230" font-size="12" fill="#c2410c">LLM 阅读 Markdown</text>
  <text x="700" y="252" font-size="11" fill="#94a3b8">总结 / 提取要点 / 写代码</text>
  <text x="700" y="274" font-size="11" fill="#94a3b8">上下文完整不丢格式</text>

  <!-- 步骤 4 -->
  <rect x="870" y="150" width="200" height="150" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
  <circle cx="920" cy="200" r="22" fill="#db2777"/>
  <text x="920" y="207" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">4</text>
  <text x="970" y="205" font-size="15" font-weight="bold" fill="#9d174d">沉淀</text>
  <text x="970" y="230" font-size="12" fill="#be185d">笔记 / 博客 / 文档</text>
  <text x="970" y="252" font-size="11" fill="#94a3b8">Markdown 直接复用</text>
  <text x="970" y="274" font-size="11" fill="#94a3b8">无样式丢失</text>

  <!-- 箭头 -->
  <line x1="260" y1="225" x2="325" y2="225" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="530" y1="225" x2="595" y2="225" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="800" y1="225" x2="865" y2="225" stroke="#475569" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- 底部价值 -->
  <rect x="60" y="360" width="1010" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="90" y="396" font-size="16" font-weight="bold" fill="#0f172a">为什么 Markdown 比纯文本更适合喂给 LLM？</text>
  <text x="90" y="424" font-size="13" fill="#475569">• 标题层级保留语义结构，LLM 可准确抓取章节重点</text>
  <text x="520" y="424" font-size="13" fill="#475569">• 代码块带语言标注，代码上下文不糊成一团</text>
  <text x="90" y="448" font-size="13" fill="#475569">• 链接/图片/表格结构化，可直接转成笔记或文档</text>
  <text x="520" y="448" font-size="13" fill="#475569">• 纯文本方案 200 字符摘要即失真，Markdown 更抗截断</text>
</svg>
