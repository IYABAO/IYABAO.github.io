<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="16" fill="url(#bg)"/>
  <text x="60" y="58" font-size="26" font-weight="bold" fill="#0f172a">fluxio-mcp 架构：让 LLM 直接读取任意信息源</text>
  <text x="60" y="88" font-size="15" fill="#64748b">MCP Server（FastMCP）· 4 个工具 + 1 个资源 · 免 API Key</text>

  <!-- 客户端列 -->
  <rect x="60" y="140" width="240" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="80" y="172" font-size="16" font-weight="bold" fill="#0f172a">LLM 客户端</text>
  <rect x="80" y="196" width="200" height="52" rx="8" fill="#f1f5f9"/>
  <text x="180" y="222" text-anchor="middle" font-size="14" fill="#334155">Claude Desktop</text>
  <text x="180" y="240" text-anchor="middle" font-size="11" fill="#94a3b8">claude_desktop_config.json</text>
  <rect x="80" y="262" width="200" height="52" rx="8" fill="#f1f5f9"/>
  <text x="180" y="288" text-anchor="middle" font-size="14" fill="#334155">Cursor</text>
  <text x="180" y="306" text-anchor="middle" font-size="11" fill="#94a3b8">Settings → MCP</text>
  <rect x="80" y="328" width="200" height="52" rx="8" fill="#f1f5f9"/>
  <text x="180" y="354" text-anchor="middle" font-size="14" fill="#334155">任意 Agent</text>
  <text x="180" y="372" text-anchor="middle" font-size="11" fill="#94a3b8">stdio 协议</text>
  <text x="180" y="436" text-anchor="middle" font-size="12" fill="#94a3b8">MCP stdio</text>
  <line x1="180" y1="390" x2="180" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 中间 Server -->
  <rect x="380" y="140" width="440" height="430" rx="14" fill="url(#server)"/>
  <text x="600" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">fluxio-mcp Server</text>
  <text x="600" y="194" text-anchor="middle" font-size="12" fill="#c7d2fe">Python · FastMCP · httpx · BeautifulSoup</text>

  <rect x="410" y="214" width="380" height="52" rx="8" fill="#eef2ff"/>
  <text x="430" y="236" font-size="14" font-weight="bold" fill="#3730a3">fetch_rss</text>
  <text x="430" y="254" font-size="12" fill="#6366f1">解析 RSS 2.0 / Atom 订阅源</text>
  <rect x="410" y="280" width="380" height="52" rx="8" fill="#eef2ff"/>
  <text x="430" y="302" font-size="14" font-weight="bold" fill="#3730a3">fetch_web</text>
  <text x="430" y="320" font-size="12" fill="#6366f1">抓取网页 → 正文纯文本（去噪）</text>
  <rect x="410" y="346" width="380" height="52" rx="8" fill="#eef2ff"/>
  <text x="430" y="368" font-size="14" font-weight="bold" fill="#3730a3">fetch_web_md</text>
  <text x="430" y="386" font-size="12" fill="#6366f1">网页 → Markdown（保留标题/代码块/表格）</text>
  <rect x="410" y="412" width="380" height="52" rx="8" fill="#eef2ff"/>
  <text x="430" y="434" font-size="14" font-weight="bold" fill="#3730a3">search_web</text>
  <text x="430" y="452" font-size="12" fill="#6366f1">网页搜索（Bing 主端点 + DuckDuckGo 降级）</text>
  <rect x="410" y="478" width="380" height="52" rx="8" fill="#dbeafe"/>
  <text x="430" y="500" font-size="14" font-weight="bold" fill="#1d4ed8">rss://{url} 资源</text>
  <text x="430" y="518" font-size="12" fill="#3b82f6">Resource：订阅源最近 15 篇</text>

  <!-- 右侧数据源列 -->
  <rect x="900" y="140" width="240" height="430" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="920" y="172" font-size="16" font-weight="bold" fill="#0f172a">数据源 / 服务</text>
  <rect x="920" y="196" width="200" height="52" rx="8" fill="#f0fdf4"/>
  <text x="1020" y="222" text-anchor="middle" font-size="14" fill="#166534">RSS / Atom</text>
  <text x="1020" y="240" text-anchor="middle" font-size="11" fill="#65a30d">订阅源</text>
  <rect x="920" y="262" width="200" height="52" rx="8" fill="#f0fdf4"/>
  <text x="1020" y="288" text-anchor="middle" font-size="14" fill="#166534">任意网页</text>
  <text x="1020" y="306" text-anchor="middle" font-size="11" fill="#65a30d">HTTP 抓取</text>
  <rect x="920" y="328" width="200" height="52" rx="8" fill="#f0fdf4"/>
  <text x="1020" y="354" text-anchor="middle" font-size="14" fill="#166534">Bing</text>
  <text x="1020" y="372" text-anchor="middle" font-size="11" fill="#65a30d">搜索（mkt=zh-CN）</text>
  <rect x="920" y="394" width="200" height="52" rx="8" fill="#f0fdf4"/>
  <text x="1020" y="420" text-anchor="middle" font-size="14" fill="#166534">DuckDuckGo</text>
  <text x="1020" y="438" text-anchor="middle" font-size="11" fill="#65a30d">海外降级端点</text>

  <!-- 连接箭头 -->
  <line x1="300" y1="355" x2="375" y2="355" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="355" x2="895" y2="355" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="342" y="342" text-anchor="middle" font-size="11" fill="#64748b">调用</text>
  <text x="862" y="342" text-anchor="middle" font-size="11" fill="#64748b">HTTP</text>

  <text x="60" y="606" font-size="13" fill="#475569">接入方式：pip install -e . → Claude/Cursor 配置 stdio 命令 <tspan font-family="Consolas,monospace" fill="#4f46e5">fluxio-mcp</tspan> 即可使用</text>
</svg>
