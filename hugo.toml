baseURL = 'https://www.plbear.com/'
languageCode = 'zh-cn'
title = 'Plbear | 后端架构 · AI工程 · 云原生技术博客'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
[pagination]
  pagerSize = 10
  summaryLength = 50

[params]
  shortTitle = 'Plbear'
  description = '10年以上后端架构师的技术博客，专注 Go/PHP 微服务架构、AI 大模型应用（MCP/RAG/Agent）、云原生（K8s/eBPF/DevOps）、工程效能与 Coding Agent 实践。'
  author = '林壮 Allen / IYABAO'
  keywords = ['Go微服务', 'PHP转Go', '后端架构', 'MCP协议', 'RAG实战', 'AI Agent', '大模型应用', 'Kubernetes', 'eBPF', 'DevOps', '云原生', '工程效能', 'Coding Agent', '技术博客']
  env = 'production'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # 首页精选（按下列顺序展示；slug 与 content/posts 文件名一致）
  featuredPosts = [
    "2026-08-28-enterprise-mcp-server",
    "2026-10-29-es-vector-search-rrf",
    "2026-08-25-ai-app-architecture",
    "2026-04-08-php-to-go-migration",
    "2026-08-20-chaos-engineering-intro",
    "2026-11-14-acceptance-http-200",
    "2026-11-12-three-agents-scorecard-playbook",
    "2026-11-10-ai-agent-lies-scorecard-governance",
    "2026-07-07-llm-streaming-engineering",
    "2026-08-04-mcp-rag-combination",
    "2026-04-21-agent-orchestration-graph",
    "2026-09-06-fluxio-mcp",
    "2026-11-14-hugo-fence-goat-render-bug",
    "2026-05-26-blog-geo-optimization",
    "2026-11-16-ai-mock-interview-30-questions-10-answered",
    "2026-11-12-job-pool-three-verifications-18-80",
    "2026-11-16-kids-first-internet-three-boundaries",
    "2026-11-17-teach-parent-ai-meds-3-blocks",
    "2024-05-08-wang-yangming-mind-emotion-self-rescue",
    "2026-01-20-pantheon-review-tech-guardian",
    "2024-11-15-adult-animation-philosophy-lessons",
    "2023-11-15-black-swan-antifragile-engineer",
    "2020-08-20-dong-jian-fo-xue-du-shu-bi-ji",
    "2022-10-28-ai-dramas-tech-metaphors",
  ]

  [params.schema]
    publisherType = "Person"

  [params.imageCDN]
    # 图床方案：站内直出（static/images 随构建发布到 /images/，走 ESA 边缘缓存）
    # 2026-11-12 从 jsDelivr @master 切到站内：解耦分支名，删/改 master 不会再让全站图片 404
    enable = true
    # 站内基础 URL
    baseURL = "https://www.plbear.com/images/"
    # 本地开发时是否使用 CDN（false 时用本地 /images/ 路径）
    useInDev = false
    # 图片懒加载
    lazyLoad = true

  [params.analytics.google]
    SiteVerificationTag = "viHbWhCyKDbYHXBvjSAav4NPwnM6tScrxInxiUUxdHI"
  [params.analytics.bing]
    SiteVerificationTag = ""

[params.homeInfoParams]
  Title = "Plbear | 后端架构 · AI工程 · 云原生"
  Content = "10年以上后端架构师，专注 Go 微服务、AI 大模型应用（MCP/RAG/Agent）、云原生与工程效能。"

[params.assets]
  disableHLJS = true

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/IYABAO'
[[params.socialIcons]]
  name = 'rss'
  url = '/index.xml'
[[params.socialIcons]]
  name = 'email'
  url = 'mailto:iyabao@vip.qq.com'

[params.search]
  enable = true

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 3
  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 4
  [[menu.main]]
    name = '友链'
    url = '/links/'
    weight = 5
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 6

[markup]
  [markup.highlight]
    style = 'github-dark'
    lineNos = true
    codeFences = true
    guessSyntax = true
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[minify]
  disableHTML = true
  minifyOutput = true

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'JSON', 'LLMS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term = ['HTML']

[taxonomies]
  tag = 'tags'
  category = 'categories'
[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'categories'
    weight = 30
  [[related.indices]]
    name = 'date'
    weight = 10
