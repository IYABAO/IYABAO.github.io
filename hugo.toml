baseURL = 'https://www.plbear.com/'
languageCode = 'zh-cn'
title = 'Plbear | 后端架构 · AI工程 · 云原生技术博客'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true
[pagination]
  pagerSize = 10
  summaryLength = 50

[params]
  description = '12年经验后端架构师的技术博客，专注 Go/PHP 微服务架构、AI 大模型应用（MCP/RAG/Agent）、云原生（K8s/eBPF/DevOps）、工程效能与 Coding Agent 实践。'
  author = '林壮 Allen / IYABAO'
  keywords = ['Go微服务', 'PHP转Go', '后端架构', 'MCP协议', 'RAG实战', 'AI Agent', '大模型应用', 'Kubernetes', 'eBPF', 'DevOps', '云原生', '工程效能', 'Coding Agent', '技术博客']
  env = 'production'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.schema]
    publisherType = "Person"

  [params.analytics.google]
    SiteVerificationTag = "viHbWhCyKDbYHXBvjSAav4NPwnM6tScrxInxiUUxdHI"
  [params.analytics.bing]
    SiteVerificationTag = ""

[params.homeInfoParams]
  Title = "Plbear | 后端架构 · AI工程 · 云原生"
  Content = "12年后端架构师，专注 Go 微服务、AI 大模型应用（MCP/RAG/Agent）、云原生与工程效能。"

[params.assets]
  disableHLJS = true

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/IYABAO'
[[params.socialIcons]]
  name = 'rss'
  url = '/index.xml'
[[params.socialIcons]]
  name = 'email'
  url = 'mailto:iyabao@vip.qq.com'

[params.search]
  enable = true

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 3
  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 4
  [[menu.main]]
    name = '友链'
    url = '/links/'
    weight = 5
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 6

[markup]
  [markup.highlight]
    style = 'github-dark'
    lineNos = true
    codeFences = true
    guessSyntax = true
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[minify]
  disableHTML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

[taxonomies]
  tag = 'tags'
  category = 'categories'
